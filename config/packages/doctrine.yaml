doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        # Désactivée en dev : la capture d'une backtrace PHP par requête SQL
        # coûte 3–5 ms/requête, amplifiée par le bind mount Windows.
        # Le profiling SQL reste actif (visible dans la toolbar), seule la stack est omise.
        profiling_collect_backtrace: false
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        dbal:
            # TLS applicatif vers MySQL. Le driver est pdo_mysql : les parametres
            # ssl_* nommes ne sont lus que par le driver mysqli, il faut donc passer
            # par driverOptions et les constantes PDO.
            # Le certificat serveur est auto-signe et porte le CN
            # « MySQL_Server_8.0.46_Auto_Generated_CA_Certificate », qui ne correspond
            # pas a l'hote « db » : la verification du nom est donc desactivee, le
            # chiffrement du transport reste effectif.
            # Ce bloc est volontairement hors du `dbal` commun : la CI monte son propre
            # MySQL sans ce certificat, l'y placer ferait echouer les jobs de test.
            options:
                !php/const PDO::MYSQL_ATTR_SSL_CA: '/etc/mysql/ca.pem'
                !php/const PDO::MYSQL_ATTR_SSL_VERIFY_SERVER_CERT: false
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
