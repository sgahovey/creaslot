<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireframe lo-fi — Mon agenda (mobile)</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI',system-ui,Arial,sans-serif; background:#eee; color:#444; font-size:14px; line-height:1.5; padding:20px 0; }
  .device { width:375px; margin:0 auto; background:#fff; border:1px solid #ccc; border-radius:22px; overflow:hidden; }
  header.wf-header { background:#eee; border-bottom:1px solid #ccc; }
  .wf-header-inner { display:flex; align-items:center; gap:12px; padding:12px 14px; }
  .wf-logo { display:flex; align-items:center; gap:8px; font-weight:700; color:#444; }
  .wf-icon { width:18px; height:18px; border:1px solid #999; border-radius:4px; display:inline-block; flex:0 0 auto; }
  .wf-tools { margin-left:auto; display:flex; align-items:center; gap:14px; }
  .wf-bell { position:relative; }
  .wf-badge { position:absolute; top:-7px; right:-9px; min-width:16px; height:16px; padding:0 4px; border-radius:8px; background:#999; color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center; }
  .wf-burger { width:26px; height:26px; border:1px solid #999; border-radius:5px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:3px; }
  .wf-burger span { width:14px; height:2px; background:#999; border-radius:2px; }
  main.wf-main { padding:16px 14px; }
  .wf-h1 { margin-bottom:12px; }
  .wf-h1 .bar { height:18px; width:150px; background:#999; border-radius:4px; }
  .bar { background:#ccc; border-radius:4px; }
  /* actions empilées pleine largeur */
  .wf-actions { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .wf-btn { display:flex; align-items:center; justify-content:center; gap:6px; border:1px solid #999; border-radius:6px; background:#eee; color:#444; padding:10px; font-size:13px; }
  .wf-btn--primary { background:#999; color:#fff; }
  .wf-breadcrumb { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .wf-breadcrumb .bar { height:8px; width:60px; }
  .wf-toggle { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .wf-switch { width:40px; height:22px; border:1px solid #999; border-radius:11px; background:#eee; position:relative; flex:0 0 auto; }
  .wf-switch::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#999; }
  /* calendrier adapté : vue JOUR en liste verticale (pas de grille semaine sur mobile) */
  .wf-cal { border:1px solid #ccc; border-radius:8px; padding:12px; }
  .wf-cal-toolbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .wf-nav-btn { width:30px; height:30px; border:1px solid #ccc; border-radius:6px; display:flex; align-items:center; justify-content:center; color:#999; }
  .wf-cal-title { height:11px; width:120px; background:#999; border-radius:4px; }
  .wf-dayrow { display:flex; gap:10px; align-items:stretch; border-top:1px solid #eee; padding:8px 0; min-height:44px; }
  .wf-dayrow .time { width:44px; flex:0 0 auto; display:flex; align-items:flex-start; }
  .wf-dayrow .time .bar { height:8px; width:34px; margin-top:2px; }
  .wf-dayrow .slot { flex:1; border:1px dashed #eee; border-radius:6px; }
  .wf-dayrow .slot.event { background:#999; border:0; }
  .wf-dayrow .slot.lunch { background:repeating-linear-gradient(-45deg,#e6e6e6,#e6e6e6 5px,#f4f4f4 5px,#f4f4f4 10px); border:0; }
  .wf-legend { display:flex; flex-direction:column; gap:8px; margin-top:12px; padding-top:12px; border-top:1px solid #eee; }
  .wf-legend .li { display:flex; align-items:center; gap:8px; }
  .wf-legend .dot { width:10px; height:10px; border-radius:50%; background:#999; }
  .wf-legend .bar { height:8px; width:120px; }
  footer.wf-footer { background:#eee; border-top:1px solid #ccc; }
  .wf-footer-inner { display:flex; flex-direction:column; gap:20px; padding:20px 16px; }
  .wf-cap { text-align:center; color:#999; font-size:12px; font-style:italic; margin:14px auto 0; }
</style>
</head>
<body>
<div class="device">

  <header class="wf-header">
    <div class="wf-header-inner">
      <div class="wf-logo"><span class="wf-icon"></span><span>CreaSlot</span></div>
      <div class="wf-tools">
        <div class="wf-bell"><span class="wf-icon"></span><span class="wf-badge">2</span></div>
        <button class="wf-burger" type="button" aria-label="Ouvrir le menu"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <main class="wf-main">
    <div class="wf-h1"><span class="bar"></span></div>

    <!-- actions empilées pleine largeur sur mobile -->
    <div class="wf-actions">
      <button type="button" class="wf-btn wf-btn--primary">Nouveau créneau</button>
      <button type="button" class="wf-btn">Liste complète</button>
    </div>

    <nav class="wf-breadcrumb" aria-label="Fil d'Ariane"><span class="bar"></span><span>›</span><span class="bar"></span></nav>

    <div class="wf-toggle"><span class="wf-switch" aria-hidden="true"></span><span class="bar" style="height:9px;width:180px"></span></div>

    <!-- Calendrier : vue JOUR en liste (adaptation mobile de la grille semaine) -->
    <section class="wf-cal" aria-label="Calendrier des créneaux (vue jour)">
      <div class="wf-cal-toolbar">
        <span class="wf-nav-btn">‹</span>
        <span class="wf-cal-title"></span>
        <span class="wf-nav-btn">›</span>
      </div>

      <div class="wf-dayrow"><div class="time"><span class="bar"></span></div><div class="slot event"></div></div>
      <div class="wf-dayrow"><div class="time"><span class="bar"></span></div><div class="slot"></div></div>
      <div class="wf-dayrow"><div class="time"><span class="bar"></span></div><div class="slot event"></div></div>
      <div class="wf-dayrow"><div class="time"><span class="bar"></span></div><div class="slot lunch"></div></div>
      <div class="wf-dayrow"><div class="time"><span class="bar"></span></div><div class="slot event"></div></div>
      <div class="wf-dayrow"><div class="time"><span class="bar"></span></div><div class="slot"></div></div>
      <div class="wf-dayrow"><div class="time"><span class="bar"></span></div><div class="slot event"></div></div>

      <div class="wf-legend">
        <span class="li"><span class="dot"></span><span class="bar"></span></span>
        <span class="li"><span class="dot"></span><span class="bar"></span></span>
        <span class="li"><span class="dot"></span><span class="bar"></span></span>
      </div>
    </section>
  </main>

  <footer class="wf-footer">
    <div class="wf-footer-inner">
      <div>
        <div class="wf-logo" style="margin-bottom:8px"><span class="wf-icon"></span><span>CreaSlot</span></div>
        <div class="bar" style="height:8px;width:90%;margin:6px 0"></div>
        <div class="bar" style="height:8px;width:70%;margin:6px 0"></div>
      </div>
      <div>
        <div class="bar" style="height:11px;width:120px;background:#999;margin-bottom:10px"></div>
        <div class="bar" style="height:8px;width:70%;margin:7px 0"></div>
        <div class="bar" style="height:8px;width:80%;margin:7px 0"></div>
        <div class="bar" style="height:8px;width:65%;margin:7px 0"></div>
      </div>
      <div>
        <div class="bar" style="height:11px;width:80px;background:#999;margin-bottom:10px"></div>
        <div class="bar" style="height:8px;width:85%;margin:7px 0"></div>
        <div class="bar" style="height:8px;width:60%;margin:7px 0"></div>
      </div>
    </div>
  </footer>

</div>
<p class="wf-cap">Wireframe lo-fi — Mon agenda (mobile ~375px)</p>
</body>
</html>
