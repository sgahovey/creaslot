# compose.prod.yml — 2 environnements (préprod + prod) derrière Caddy (US-9.2).
# Image build-once `creaslot:prod` (US-9.1). À lancer AVEC le fichier d'infra dédié :
#   docker compose -f compose.prod.yml --env-file .env.deploy.local <cmd>
#
# `name:` isole ce projet du projet de dev "creaslot" (conteneurs/volumes/réseau
# distincts) : un `down -v` ici n'affecte pas l'environnement de développement.
name: creaslot_prod

# Politique de logs Docker bornee (evite la croissance non bornee du driver json-file
# par defaut) : 3 fichiers de 10 Mo max par conteneur. Appliquee a tous les services.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Base commune aux conteneurs applicatifs (app + worker) : reglages partages uniquement.
# L'image est definie PAR SERVICE (cf. ci-dessous) car preprod et prod, sur la meme machine,
# doivent pouvoir tourner sur des tags GHCR DIFFERENTS (PREPROD_IMAGE_TAG / PROD_IMAGE_TAG).
# Toutes les images sont tirees de GHCR (build-once par le pipeline CI/CD, tag = SHA) ;
# "latest" par defaut pour le fallback manuel, et le "build:" d'app-prod permet de builder en secours.
x-app-base: &app-base
  restart: unless-stopped
  logging: *default-logging
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: mysql:8.0
    # --log-bin-trust-function-creators=1 requis pour creer le trigger d'audit US-12.1
    # par un user non-SUPER quand le binary logging est actif (erreur 1419 sinon).
    command: --log-bin-trust-function-creators=1
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PREPROD_PASSWORD: ${MYSQL_PREPROD_PASSWORD}
      MYSQL_PROD_PASSWORD: ${MYSQL_PROD_PASSWORD}
    volumes:
      - mysql_data_prod:/var/lib/mysql
      # Crée les 2 bases + 2 users au tout premier démarrage (volume vierge).
      - ./docker/mysql/init-prod.sh:/docker-entrypoint-initdb.d/init-prod.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - creaslot-prod-net

  app-preprod:
    <<: *app-base
    image: ghcr.io/sgahovey/creaslot:${PREPROD_IMAGE_TAG:-latest}
    env_file:
      - .env.preprod
      - path: .env.preprod.local
        required: false
    volumes:
      - assets_preprod:/srv-assets
      # Autorite auto-signee de MySQL, extraite du datadir : elle permet a PDO
      # d'ouvrir la connexion en TLS (cf. doctrine.yaml, bloc when@prod).
      - ./docker/mysql/ca.pem:/etc/mysql/ca.pem:ro
    networks:
      - creaslot-prod-net
      - web

  app-prod:
    <<: *app-base
    image: ghcr.io/sgahovey/creaslot:${PROD_IMAGE_TAG:-latest}
    build:
      context: .
      target: runtime
    env_file:
      - .env.prod
      - path: .env.prod.local
        required: false
    volumes:
      - assets_prod:/srv-assets
      - ./docker/mysql/ca.pem:/etc/mysql/ca.pem:ro
    networks:
      - creaslot-prod-net
      - web

  worker-preprod:
    <<: *app-base
    image: ghcr.io/sgahovey/creaslot:${PREPROD_IMAGE_TAG:-latest}
    command: ["php", "bin/console", "messenger:consume", "async", "-v", "--time-limit=3600", "--memory-limit=128M"]
    env_file:
      - .env.preprod
      - path: .env.preprod.local
        required: false
    volumes:
      - ./docker/mysql/ca.pem:/etc/mysql/ca.pem:ro
    networks:
      - creaslot-prod-net

  worker-prod:
    <<: *app-base
    image: ghcr.io/sgahovey/creaslot:${PROD_IMAGE_TAG:-latest}
    command: ["php", "bin/console", "messenger:consume", "async", "-v", "--time-limit=3600", "--memory-limit=128M"]
    env_file:
      - .env.prod
      - path: .env.prod.local
        required: false
    volumes:
      - ./docker/mysql/ca.pem:/etc/mysql/ca.pem:ro
    networks:
      - creaslot-prod-net

volumes:
  assets_preprod:
  assets_prod:
  mysql_data_prod:

networks:
  creaslot-prod-net:
    driver: bridge
  # Reseau du reverse proxy mutualise (stack infra-proxy, depot dedie).
  # Declare EXTERNAL : cree une seule fois sur l'hote (`docker network create web`),
  # partage avec les autres applications servies par le meme Caddy. Compose y pose
  # automatiquement le nom du service comme alias reseau (app-prod, app-preprod),
  # qui est exactement ce que le Caddyfile cible en php_fastcgi.
  web:
    external: true
    name: web
